name: Deploy ShallIT Production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-shallit-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_URL: https://mt.shallit.co.il/api
        run: |
          npm ci
          npm run build

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish API
        run: dotnet publish backend/MaintTrack.Api/MaintTrack.Api.csproj -c Release -o ./publish/api

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: shallit-production-build
          path: |
            frontend/build
            publish/api

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: shallit-production-build

      - name: Deploy via SSH
        env:
          DEPLOY_HOST: ${{ secrets.PRODUCTION_EC2_HOST }}
          DEPLOY_USER: ${{ secrets.PRODUCTION_EC2_USER }}
          DEPLOY_KEY: ${{ secrets.PRODUCTION_EC2_SSH_KEY }}
        run: |
          if [ -z "$DEPLOY_HOST" ]; then
            echo "PRODUCTION_EC2_* secrets not configured — build only."
            exit 0
          fi
          mkdir -p ~/.ssh
          echo "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          export DEPLOY_KEY=~/.ssh/deploy_key
          ./deploy/deploy.sh
