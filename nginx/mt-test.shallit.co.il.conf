# Nginx site template for MaintTrack TEST environment (ShallIT).
# Install: sudo cp nginx/mt-test.shallit.co.il.conf /etc/nginx/sites-available/mt-test.shallit.co.il
#          sudo ln -sf /etc/nginx/sites-available/mt-test.shallit.co.il /etc/nginx/sites-enabled/
# Adjust ssl_certificate paths before enabling.
#
# This file is entirely separate from nginx/mt.shallit.co.il.conf (Production):
#   - different server_name (mt-test.shallit.co.il)
#   - different upstream port (5063 vs 5062)
#   - different web root (/var/www/mainttrack-test vs /var/www/mainttrack/web)
# Installing/enabling this site does NOT modify or reload away Production's config.
# Always run `sudo nginx -t` before `systemctl reload nginx`.

upstream mainttrack_test_api {
    server 127.0.0.1:5063;
    keepalive 32;
}

server {
    listen 80;
    server_name mt-test.shallit.co.il;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name mt-test.shallit.co.il;

    # ssl_certificate     /etc/letsencrypt/live/mt-test.shallit.co.il/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/mt-test.shallit.co.il/privkey.pem;

    root /var/www/mainttrack-test;
    index index.html;

    client_max_body_size 42m;

    location /api/ {
        proxy_pass http://mainttrack_test_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    location /health {
        proxy_pass http://mainttrack_test_api;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
