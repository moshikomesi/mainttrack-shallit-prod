# Nginx site config for MaintTrack TEST environment.
# Install target: /etc/nginx/sites-available/mainttrack-test
#
# ISOLATED FROM PRODUCTION:
#   - Different listen port (8080) — Production listens on 80/443 for mt.shallit.co.il
#   - Different upstream (127.0.0.1:5001) — Production proxies to 127.0.0.1:5000
#   - Different web root (/var/www/mainttrack-test/build) — Production serves
#     /var/www/mainttrack/build
# Installing/enabling this file does NOT modify, replace, reload-away, or
# reference /etc/nginx/sites-available/mt.shallit.co.il in any way.
#
# ACCURACY NOTE — please verify before enabling:
#   The only Production nginx reference available in this repo
#   (nginx/mt.shallit.co.il.conf) contains `client_max_body_size 25M;` and the
#   standard reverse-proxy headers below — those are copied verbatim.
#   It does NOT contain explicit `add_header` security header directives.
#   The security headers below are therefore commonly-recommended defaults,
#   NOT verified against the live production nginx.conf on the server (no
#   server connection was made). If production's *live* config sets specific
#   security headers not reflected in the repo copy, replace the block below
#   with the exact directives from production so TEST matches byte-for-byte.

upstream mainttrack_test_api {
    server 127.0.0.1:5001;
    keepalive 32;
}

server {
    listen 8080;
    server_name mainttrack-test;   # no domain assigned; reachable via <server-ip>:8080

    root /var/www/mainttrack-test/build;
    index index.html;

    # --- Upload handling (copied verbatim from nginx/mt.shallit.co.il.conf) ---
    client_max_body_size 25M;

    # --- Security headers (NOT found in the repo's production reference —
    #     common defaults pending confirmation against the live server) ---
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /api/ {
        proxy_pass http://mainttrack_test_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    location /health {
        proxy_pass http://mainttrack_test_api;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
