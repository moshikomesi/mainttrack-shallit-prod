# Nginx site template for MaintTrack (ShallIT production).
# Install: sudo cp nginx/mt.shallit.co.il.conf /etc/nginx/sites-available/mt.shallit.co.il
#          sudo ln -sf /etc/nginx/sites-available/mt.shallit.co.il /etc/nginx/sites-enabled/
# Adjust ssl_certificate paths and upstream port before enabling.

upstream mainttrack_api {
    server 127.0.0.1:5062;
    keepalive 32;
}

server {
    listen 80;
    server_name mt.shallit.co.il;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name mt.shallit.co.il;

    # ssl_certificate     /etc/letsencrypt/live/mt.shallit.co.il/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/mt.shallit.co.il/privkey.pem;

    root /var/www/mainttrack/web;
    index index.html;

    client_max_body_size 42m;

    location /api/ {
        proxy_pass http://mainttrack_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    location /health {
        proxy_pass http://mainttrack_api;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
